<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Uray Diana</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <div class="menu-center">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main class="contact-section">
        <div class="contact-container">
            <div class="contact-form-box">

                <h1>Hubungi Saya</h1>

                <p>
                    Silakan isi form di bawah ini jika ingin menghubungi saya.
                </p>

                <form
                    id="contactForm"
                    class="contact-form"
                    action="https://formsubmit.co/h1101251024@student.untan.ac.id"
                    method="POST">

                    <input
                        type="hidden"
                        name="_subject"
                        value="Pesan dari Website Portfolio Uray Diana">

                    <div class="form-group">
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Nama Anda"
                            required>
                    </div>

                    <div class="form-group">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email Anda"
                            required>
                    </div>

                    <div class="form-group">
                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Tulis pesan Anda..."
                            required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        Kirim Pesan
                    </button>

                    <p id="hasil"></p>

                </form>

            </div>
        </div>
    </main>

    <script src="js/main.js"></script>

</body>
</html>
